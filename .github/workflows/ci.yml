name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - run: sqlc diff
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/anugrahsputra/portfolio-backend:${{ github.sha }}

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      DEPLOY_DIR: /home/ubuntu/projects/golang/portfolio-backend
    steps:
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -D -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -o BatchMode=yes ubuntu@"$DEPLOY_HOST" "
            set -e
            cd $DEPLOY_DIR
            git pull --ff-only origin main
            docker login ghcr.io -u $GHCR_USER --password-stdin
            trap 'docker logout ghcr.io' EXIT
            export IMAGE_TAG=$IMAGE_TAG
            docker compose pull
            docker compose up -d --wait --wait-timeout 120
            docker image prune -f
          "
