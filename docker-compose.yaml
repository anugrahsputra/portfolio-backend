services:
  app:
    image: ghcr.io/anugrahsputra/portfolio-backend:${IMAGE_TAG:?set IMAGE_TAG to the image commit sha}
    container_name: portfolio-api
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    networks:
      - shared-net

networks:
  shared-net:
    external: true
